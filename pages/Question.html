<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leiturar - Simulado</title>

<style>
    /* Reset e Configurações Base */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
        margin: 0;
        background-color: #1C3B3B; /* Mantendo o padrão verde escuro */
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 40px 20px;
        min-height: 100vh;
    }

    /* Container Principal */
    .container {
        background-color: #C9FF8F; /* Verde limão neobrutalista */
        width: 100%;
        max-width: 850px;
        border: 5px solid #000000;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 10px 10px 0px #000000;
        padding-bottom: 25px;
    }

    /* Topo / Header */
    header {
        display: flex;
        align-items: center;
        padding: 25px 35px;
        background-color: #C9FF8F;
        border-bottom: 5px solid #000000;
    }

    .menu-icon {
        width: 35px;
        height: 6px;
        background-color: #000000;
        position: relative;
        margin-right: 20px;
    }

    .menu-icon::before,
    .menu-icon::after {
        content: "";
        width: 35px;
        height: 6px;
        background-color: #000000;
        position: absolute;
        left: 0;
    }

    .menu-icon::before { top: -10px; }
    .menu-icon::after { top: 10px; }

    .logo {
        font-size: 32px;
        font-weight: 900;
        color: #000000;
        text-transform: uppercase;
        letter-spacing: -1px;
    }

    /* Bloco de Conteúdo (Quadro da Questão) */
    .content {
        background-color: #ffffff;
        margin: 30px auto;
        width: 92%;
        padding: 35px;
        border-radius: 12px;
        border: 4px solid #000000;
        box-shadow: 6px 6px 0px #000000;
    }

    .question-title {
        font-size: 24px;
        font-weight: 900;
        color: #000000;
        text-transform: uppercase;
        margin-bottom: 20px;
        border-bottom: 3px dashed #000000;
        padding-bottom: 10px;
    }

    .question-text {
        font-size: 18px;
        font-weight: 600;
        color: #000000;
        margin-bottom: 25px;
        line-height: 1.5;
    }

    /* Customização Neobrutalista das Opções (Estilo Cards Selecionáveis) */
    .option {
        margin-top: 15px;
        display: flex;
        align-items: center;
        font-size: 16px;
        font-weight: 700;
        color: #000000;
        cursor: pointer;
        padding: 14px 18px;
        background-color: #ffffff;
        border: 3px solid #000000;
        border-radius: 8px;
        box-shadow: 3px 3px 0px #000000;
        transition: all 0.1s ease;
    }

    .option:hover {
        transform: translate(-2px, -2px);
        box-shadow: 5px 5px 0px #000000;
        background-color: #f9f9f9;
    }

    /* Quando o radio interno está marcado, destaca o container pai via JavaScript (opcional) ou CSS nativo se suportado */
    .option:has(input:checked) {
        background-color: #FFF275; /* Amarelo de destaque ao selecionar */
        box-shadow: 3px 3px 0px #000000;
    }

    .option input {
        transform: scale(1.4);
        margin-right: 15px;
        cursor: pointer;
        accent-color: #000000; /* Força o preenchimento do radio em preto */
    }

    /* ------ ÁREA DE NAVEGAÇÃO ------ */
    .navigation {
        display: flex;
        justify-content: space-between;
        margin-top: 35px;
        gap: 15px; 
    }

    .nav-btn {
        padding: 12px 24px; 
        font-size: 16px; 
        font-weight: 800;
        border: 3px solid #000000; 
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.1s ease;
        text-transform: uppercase;
        background-color: #ffffff;
        color: #000000;
        flex-grow: 1; 
        box-shadow: 4px 4px 0px #000000; 
    }

    .nav-btn:hover:not([disabled]) {
        background-color: #f0f0f0;
        transform: translate(-2px, -2px); 
        box-shadow: 6px 6px 0px #000000; 
    }

    .nav-btn:active:not([disabled]) {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0px #000000;
    }

    .nav-btn[disabled] {
        background-color: #dcdcdc;
        color: #777777;
        cursor: not-allowed;
        box-shadow: 0px 0px 0px #000000;
        transform: none;
        opacity: 0.6;
    }

    /* Botão Finalizar / Enviar */
    #submitBtn {
        background-color: #7CD957; /* Verde vivo */
        color: #000000;
        width: 100%;
        margin-top: 25px;
        padding: 14px;
        font-size: 18px;
        font-weight: 900;
        text-transform: uppercase;
        border: 3px solid #000000;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: 4px 4px 0px #000000;
        transition: all 0.1s ease;
        display: none; /* Controlado pelo JS */
    }

    #submitBtn:hover {
        background-color: #8ce666;
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0px #000000;
    }

    #submitBtn:active {
        transform: translate(4px, 4px);
        box-shadow: 0px 0px 0px #000000;
    }
</style>
</head>

<body>

<div class="container">

    <header>
        <div class="menu-icon" onclick="window.location.href='Menu.html'" style="cursor: pointer;"></div>
        <div class="logo">Leiturar</div>
    </header>

    <div class="content">
        <div id="title" class="question-title">Questão 1</div>
        <div id="questionText" class="question-text">Carregando pergunta...</div>
        
        <label class="option">
            <input type="radio" name="questao" value="A" id="altA"> 
            <span id="textA"></span>
        </label>
        <label class="option">
            <input type="radio" name="questao" value="B" id="altB"> 
            <span id="textB"></span>
        </label>
        <label class="option">
            <input type="radio" name="questao" value="C" id="altC"> 
            <span id="textC"></span>
        </label>
        <label class="option">
            <input type="radio" name="questao" value="D" id="altD"> 
            <span id="textD"></span>
        </label>
        
        <div class="navigation">
            <button id="prevBtn" class="nav-btn" disabled>Anterior</button>
            <button id="nextBtn" class="nav-btn">Próxima</button>
        </div>

        <button id="submitBtn" onclick="submitAnswers()">Enviar respostas</button>
    </div>
</div>

<script>
    const API_URL = 'http://localhost:4000';   
    
    let bookId = '';
    let questions = [];
    let currentQuestionIndex = 0;
    let studentAnswers = {}; 

    const titleElement = document.getElementById('title');
    const questionTextElement = document.getElementById('questionText');
    const alternativesElements = {
        A: document.getElementById('textA'),
        B: document.getElementById('textB'),
        C: document.getElementById('textC'),
        D: document.getElementById('textD')
    };
    const radioInputs = [
        document.getElementById('altA'),
        document.getElementById('altB'),
        document.getElementById('altC'),
        document.getElementById('altD')
    ];
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const submitBtn = document.getElementById('submitBtn');

    const indexToLetter = ['A', 'B', 'C', 'D']; 
    
    function getBookIdFromUrl() {
        const params = new URLSearchParams(window.location.search);
        return params.get('livro');
    }

    async function loadQuestions() {
        bookId = getBookIdFromUrl();
        if (!bookId) {
            questionTextElement.innerText = "Erro: ID do livro não encontrado.";
            return;
        }

        const token = localStorage.getItem('leiturar_token');
        if (!token) {
            alert('Sessão expirada. Faça login novamente.');
            window.location.href = 'Login.html';
            return;
        }

        try {
            const response = await fetch(`${API_URL}/books/${bookId}/questions`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            questions = await response.json();

            if (response.ok && questions.length > 0) {
                renderQuestion(0);
            } else if (response.ok && questions.length === 0) {
                questionTextElement.innerText = "Nenhuma questão encontrada para este livro.";
            } else {
                questionTextElement.innerText = `Erro ao carregar questões: ${questions.message || 'Erro desconhecido.'}`;
            }
        } catch (error) {
            console.error('Erro na requisição:', error);
            questionTextElement.innerText = 'Erro de conexão com o servidor de questões.';
        }
    }

    function renderQuestion(index) {
        if (index < 0 || index >= questions.length) return;

        currentQuestionIndex = index;
        const q = questions[index];
        const questionNumber = index + 1;

        titleElement.innerText = `Questão ${questionNumber} de ${questions.length}`;
        questionTextElement.innerText = q.pergunta;

        radioInputs.forEach(input => input.checked = false);
        q.alternativas.forEach((altText, altIndex) => {
            const letter = indexToLetter[altIndex];
            if (alternativesElements[letter]) {
                alternativesElements[letter].innerText = altText;
            }
        });

        const savedAnswerLetter = studentAnswers[index];
        if (savedAnswerLetter) {
            const radioToSelect = document.getElementById(`alt${savedAnswerLetter}`);
            if (radioToSelect) radioToSelect.checked = true;
        }

        updateNavigationButtons();
    }
    
    function saveAnswer() {
        const selectedRadio = radioInputs.find(input => input.checked);
        if (selectedRadio) {
            studentAnswers[currentQuestionIndex] = selectedRadio.value;
        }
    }

    function updateNavigationButtons() {
        prevBtn.disabled = currentQuestionIndex === 0;
        nextBtn.style.display = currentQuestionIndex === questions.length - 1 ? 'none' : 'inline-block';
        submitBtn.style.display = currentQuestionIndex === questions.length - 1 ? 'block' : 'none';
    }

    prevBtn.onclick = () => { saveAnswer(); renderQuestion(currentQuestionIndex - 1); };
    nextBtn.onclick = () => { saveAnswer(); renderQuestion(currentQuestionIndex + 1); };
    
    radioInputs.forEach(input => {
        input.addEventListener('change', saveAnswer);
    });
    
    async function submitAnswers() {
        saveAnswer(); 

        const token = localStorage.getItem('leiturar_token');

        if (Object.keys(studentAnswers).length < questions.length) {
            const confirm = window.confirm('Você não respondeu todas as questões. Enviar assim mesmo?');
            if (!confirm) return;
        }

        const answersArray = questions.map((_, index) => {
            return studentAnswers[index] || 'N'; 
        });

        const payload = {
            livro: bookId, 
            respostas: answersArray 
        };

        try {
            const response = await fetch(`${API_URL}/books/corrigir`, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (response.ok) {
                alert(`Resultado: Você acertou ${result.acertos} de ${result.total} questões!`);
                window.location.href = 'Menu.html';
            } else {
                alert(`Erro na correção: ${result.message || 'Erro no servidor.'}`);
            }
        } catch (error) {
            console.error('Erro na requisição para o corretor:', error);
            alert('Erro de conexão com o Servidor Node (Porta 4000). Verifique se o backend está rodando.');
        }
    }

    window.onload = loadQuestions;
</script>
</body>
</html>
