<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leiturar - Recomendações</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
        background-color: #1C3B3B;
        display: flex;
        justify-content: center;
        padding: 0;
        min-height: 100vh;
    }

    .container {
        background-color: #C9FF8F;
        width: 100%;
        max-width: 1200px;
        min-height: 100vh;
        border-left: 6px solid #000000;
        border-right: 6px solid #000000;
        position: relative;
        display: flex;
        flex-direction: column;
    }

    header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 25px 35px;
        background-color: #C9FF8F;
        border-bottom: 6px solid #000000;
        position: relative;
    }

    .left-area { display: flex; align-items: center; gap: 25px; }

    .menu-icon {
        width: 35px;
        height: 6px;
        background-color: #000000;
        position: relative;
        cursor: pointer;
        transition: transform 0.1s ease;
    }
    .menu-icon::before,
    .menu-icon::after {
        content: "";
        width: 35px;
        height: 6px;
        background-color: #000000;
        position: absolute;
        left: 0;
    }
    .menu-icon::before { top: -10px; }
    .menu-icon::after { top: 10px; }
    .menu-icon:hover { transform: scale(1.1); }

    .logo {
        font-size: 32px;
        font-weight: 900;
        color: #000000;
        text-transform: uppercase;
        letter-spacing: -1px;
    }

    /* DROPDOWN */
    .dropdown-menu {
        position: absolute;
        top: 80px;
        left: 35px;
        background-color: #ffffff;
        border: 4px solid #000000;
        border-radius: 12px;
        display: none;
        flex-direction: column;
        width: 200px;
        z-index: 1500;
        box-shadow: 6px 6px 0px #000000;
        overflow: hidden;
    }
    .dropdown-menu button {
        padding: 14px 16px;
        background: #ffffff;
        border: none;
        border-bottom: 3px solid #000000;
        cursor: pointer;
        font-weight: 800;
        text-align: left;
        font-size: 15px;
        color: #000000;
        transition: background-color 0.1s ease;
    }
    .dropdown-menu button:hover { background-color: #C9FF8F; }
    .dropdown-menu button:last-child {
        border-bottom: none;
        background-color: #ff6961;
        color: white;
    }
    .dropdown-menu button:last-child:hover { background-color: #ff5252; }

    /* CONTEÚDO */
    .content {
        background-color: #ffffff;
        margin: 40px auto;
        width: 92%;
        padding: 30px;
        border-radius: 16px;
        border: 4px solid #000000;
        box-shadow: 8px 8px 0px #000000;
        flex-grow: 1;
        margin-bottom: 40px;
    }

    .section-title {
        font-size: 28px;
        font-weight: 900;
        color: #000;
        text-transform: uppercase;
        letter-spacing: -0.5px;
        margin-bottom: 8px;
    }
    .section-sub {
        font-size: 15px;
        font-weight: 500;
        color: #333;
        margin-bottom: 25px;
    }

    /* BLOCO DE TAGS */
    .tags-box {
        background: #f3ffe0;
        border: 4px solid #000;
        border-radius: 12px;
        padding: 22px;
        margin-bottom: 25px;
        box-shadow: 4px 4px 0px #000000;
    }
    .tags-box strong {
        display: block;
        font-size: 16px;
        font-weight: 800;
        text-transform: uppercase;
        margin-bottom: 12px;
        color: #000;
    }
    .tags-list {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
    }
    .tag-chip {
        padding: 8px 14px;
        border: 3px solid #000;
        border-radius: 999px;
        background: white;
        cursor: pointer;
        font-size: 13px;
        font-weight: 700;
        color: #000;
        user-select: none;
        transition: all 0.1s ease;
    }
    .tag-chip:hover {
        transform: translate(-2px, -2px);
        box-shadow: 3px 3px 0px #000;
        background: #eaffd8;
    }
    .tag-chip.selected {
        background: #7CD957;
        color: #000;
        box-shadow: 3px 3px 0px #000;
    }

    .actions {
        margin-top: 22px;
        display: flex;
        gap: 14px;
        align-items: center;
        flex-wrap: wrap;
    }
    .btn-primary {
        background: #7CD957;
        border: 3px solid #000;
        border-radius: 10px;
        padding: 12px 26px;
        font-weight: 800;
        font-size: 16px;
        text-transform: uppercase;
        cursor: pointer;
        box-shadow: 4px 4px 0px #000;
        transition: all 0.1s ease;
    }
    .btn-primary:hover {
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0px #000;
        background: #8ce666;
    }
    .btn-primary:active {
        transform: translate(4px, 4px);
        box-shadow: 0px 0px 0px #000;
    }
    .btn-primary:disabled {
        background: #ccc;
        cursor: not-allowed;
        transform: none !important;
        box-shadow: none !important;
    }

    .btn-secondary {
        background: white;
        border: 3px solid #000;
        border-radius: 10px;
        padding: 12px 20px;
        font-weight: 800;
        text-transform: uppercase;
        cursor: pointer;
        box-shadow: 4px 4px 0px #000;
        transition: all 0.1s ease;
    }
    .btn-secondary:hover {
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0px #000;
        background: #f0f0f0;
    }

    .feedback {
        margin-top: 14px;
        font-size: 14px;
        font-weight: 600;
        color: #333;
    }

    /* RESULTADO */
    .results-header {
        font-size: 20px;
        font-weight: 900;
        text-transform: uppercase;
        color: #000;
        margin-top: 25px;
        margin-bottom: 4px;
    }
    .results-sub {
        font-size: 13px;
        color: #555;
        font-weight: 600;
        margin-bottom: 18px;
    }
    .results-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
        gap: 22px;
    }

    .book {
        background-color: #C9FF8F;
        border: 3px solid #000;
        border-radius: 12px;
        padding: 14px;
        text-align: center;
        cursor: pointer;
        transition: all 0.1s ease;
        box-shadow: 4px 4px 0px #000;
        display: flex;
        flex-direction: column;
    }
    .book:hover {
        transform: translate(-4px, -4px);
        box-shadow: 8px 8px 0px #000;
    }
    .book img {
        width: 100%;
        height: 220px;
        object-fit: cover;
        border-radius: 8px;
        border: 2px solid #000;
        background: #eee;
    }
    .book-title {
        margin-top: 10px;
        font-weight: 800;
        font-size: 14px;
        color: #000;
        text-transform: uppercase;
        line-height: 1.2;
    }
    .book-author {
        font-size: 11px;
        color: #333;
        margin-top: 4px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.3px;
    }
    .book-score {
        margin-top: 8px;
        background: #000;
        color: #C9FF8F;
        font-size: 11px;
        font-weight: 800;
        padding: 4px 8px;
        border-radius: 999px;
        align-self: center;
        text-transform: uppercase;
    }
</style>
</head>
<body>

<div class="container">
    <header>
        <div class="left-area">
            <div class="menu-icon" onclick="toggleDropdown()"></div>
            <div class="logo">Leiturar</div>
        </div>

        <div id="dropdownMenu" class="dropdown-menu">
            <button onclick="window.location.href='menu.html'">Menu</button>
            <button onclick="window.location.href='Favoritos.html'">Favoritos</button>
            <button onclick="window.location.href='ajuda.html'">Dúvidas</button>
            <button onclick="handleLogout()">Sair</button>
        </div>
    </header>

    <div class="content">
        <div class="section-title">Recomendações para você</div>
        <div class="section-sub">
            Selecione os temas que mais te interessam e a gente sugere livros do acervo com mais tags em comum.
        </div>

        <div class="tags-box">
            <strong>Escolha um ou mais temas</strong>
            <div class="tags-list" id="tagsList">
                <span style="color:#777; font-size:13px;">Carregando temas...</span>
            </div>
            <div class="actions">
                <button class="btn-primary" id="btnRecomendar" onclick="recomendar()">Buscar recomendações</button>
                <button class="btn-secondary" onclick="limparSelecao()">Limpar</button>
            </div>
            <div class="feedback" id="feedback"></div>
        </div>

        <div id="results"></div>
    </div>
</div>

<script>
    const API_URL = 'http://localhost:4000';
    let availableTags = [];
    const selectedTags = new Set();

    function handleLogout() {
        localStorage.removeItem('leiturar_token');
        localStorage.removeItem('leiturar_user');
        window.location.href = 'Login.html';
    }

    function escapeHtml(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        })[c]);
    }

    function toggleDropdown() {
        const m = document.getElementById('dropdownMenu');
        m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
    }
    window.addEventListener('click', e => {
        const m = document.getElementById('dropdownMenu');
        const i = document.querySelector('.menu-icon');
        if (!m.contains(e.target) && !i.contains(e.target)) m.style.display = 'none';
    });

    async function loadTags() {
        const token = localStorage.getItem('leiturar_token');
        if (!token) { window.location.href = 'Login.html'; return; }

        try {
            const r = await fetch(`${API_URL}/books/tags`, {
                headers: { Authorization: `Bearer ${token}` }
            });
            const data = await r.json();
            availableTags = data.tags || [];
            renderTags();
        } catch (err) {
            document.getElementById('tagsList').innerHTML =
                '<span style="color:#b00">Erro ao carregar temas. O backend está rodando?</span>';
        }
    }

    function renderTags() {
        const list = document.getElementById('tagsList');
        if (availableTags.length === 0) {
            list.innerHTML = '<span style="color:#555">Nenhum tema cadastrado nos livros.</span>';
            return;
        }
        list.innerHTML = availableTags.map(t => `
            <span class="tag-chip${selectedTags.has(t) ? ' selected' : ''}" data-tag="${escapeHtml(t)}">
                ${escapeHtml(t)}
            </span>
        `).join('');
        list.querySelectorAll('.tag-chip').forEach(el => {
            el.addEventListener('click', () => {
                const t = el.getAttribute('data-tag');
                if (selectedTags.has(t)) selectedTags.delete(t);
                else selectedTags.add(t);
                el.classList.toggle('selected');
                updateFeedback();
            });
        });
    }

    function updateFeedback() {
        const n = selectedTags.size;
        document.getElementById('feedback').innerText =
            n === 0 ? '' : `${n} tema${n > 1 ? 's' : ''} selecionado${n > 1 ? 's' : ''}.`;
    }

    function limparSelecao() {
        selectedTags.clear();
        document.querySelectorAll('.tag-chip.selected').forEach(el => el.classList.remove('selected'));
        document.getElementById('results').innerHTML = '';
        updateFeedback();
    }

    async function recomendar() {
        const token = localStorage.getItem('leiturar_token');
        if (!token) { window.location.href = 'Login.html'; return; }

        if (selectedTags.size === 0) {
            document.getElementById('feedback').innerText = 'Selecione pelo menos um tema antes.';
            return;
        }

        const btn = document.getElementById('btnRecomendar');
        btn.disabled = true;
        btn.innerText = 'Buscando...';
        document.getElementById('results').innerHTML = '';

        try {
            const r = await fetch(`${API_URL}/books/recommend`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    Authorization: `Bearer ${token}`
                },
                body: JSON.stringify({ tags: Array.from(selectedTags) })
            });
            const data = await r.json();
            renderResults(data);
        } catch (err) {
            document.getElementById('results').innerHTML =
                '<p style="color:#b00">Erro ao buscar recomendações.</p>';
        } finally {
            btn.disabled = false;
            btn.innerText = 'Buscar recomendações';
        }
    }

    function renderResults(data) {
        const target = document.getElementById('results');
        if (!data || !data.recomendacoes || data.recomendacoes.length === 0) {
            target.innerHTML = `
                <p style="margin-top:18px;color:#555;font-weight:600">
                    Nenhum livro do acervo bate com os temas escolhidos. Tente combinar com tags mais comuns.
                </p>`;
            return;
        }

        const header = `
            <div class="results-header">
                ${data.recomendacoes.length} livro${data.recomendacoes.length > 1 ? 's' : ''}
                encontrado${data.recomendacoes.length > 1 ? 's' : ''}
            </div>
            <div class="results-sub">
                Filtrando por: ${data.tagsSelecionadas.join(', ')} - ordenados por temas em comum
            </div>
        `;

        const grid = data.recomendacoes.map(b => {
            const img = b.coverUrl || `img/${b._id}.jpg`;
            const goto = b.htmlUrl
                ? `reader.html?id=${encodeURIComponent(b._id)}`
                : `pdfs/${b._id}.pdf`;
            return `
                <div class="book" onclick="window.location.href='${goto}'">
                    <img src="${img}" alt="Capa"
                        onerror="this.src='https://placehold.co/190x220/cccccc/000?text=Sem+capa'">
                    <div class="book-title">${escapeHtml(b.titulo)}</div>
                    <div class="book-author">${escapeHtml(b.autor || '')}</div>
                    <div class="book-score">${b.score} tema${b.score > 1 ? 's' : ''} em comum</div>
                </div>
            `;
        }).join('');

        target.innerHTML = header + `<div class="results-grid">${grid}</div>`;
    }

    window.onload = loadTags;
</script>

</body>
</html>
