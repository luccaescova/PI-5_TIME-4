<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leiturar - Registrar</title>
<style>
    /* Reset e Configurações Base */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #1C3B3B; /* Verde escuro padrão do sistema */
    }

    /* Container Principal Neobrutalista */
    .register-container {
        background-color: #C9FF8F; /* Verde limão vibrante */
        width: 100%;
        max-width: 420px;
        padding: 35px;
        border-radius: 16px;
        border: 5px solid #000000;
        box-shadow: 10px 10px 0px #000000;
        text-align: center;
    }

    /* Título com traço grosso e caixa alta */
    .register-title {
        font-size: 32px;
        font-weight: 900;
        color: #000000;
        margin-bottom: 30px;
        text-transform: uppercase;
        border-bottom: 4px dashed #000000;
        padding-bottom: 12px;
        letter-spacing: -0.5px;
    }

    /* Inputs Estilizados em Bloco */
    input[type="text"],
    input[type="email"],
    input[type="password"] {
        width: 100%;
        padding: 14px;
        margin-bottom: 18px;
        border: 3px solid #000000;
        border-radius: 8px;
        box-shadow: inset 2px 2px 0px rgba(0,0,0,0.1);
        font-size: 16px;
        font-weight: 700;
        color: #000000;
        background-color: #ffffff;
        transition: all 0.1s ease;
    }

    /* Foco nos Inputs com troca de fundo */
    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="password"]:focus {
        border-color: #000000;
        background-color: #ffffff;
        outline: none;
        box-shadow: 4px 4px 0px #000000;
        transform: translate(-2px, -2px);
    }

    /* Botão Principal em Bloco Sólido */
    .register-btn {
        width: 100%;
        padding: 14px;
        background-color: #7CD957; /* Verde de destaque */
        color: #000000;
        font-size: 18px;
        font-weight: 900;
        text-transform: uppercase;
        border: 3px solid #000000;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: 4px 4px 0px #000000;
        transition: all 0.1s ease;
        margin-top: 5px;
    }

    .register-btn:hover {
        background-color: #8ce666;
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0px #000000;
    }

    .register-btn:active {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0px #000000;
    }

    /* Link de Alternância */
    .login-link {
        display: inline-block;
        margin-top: 20px;
        font-size: 15px;
        color: #000000;
        text-decoration: none;
        font-weight: 800;
        cursor: pointer;
        border-bottom: 2px solid transparent;
        transition: all 0.1s ease;
    }

    .login-link:hover {
        border-bottom-color: #000000;
    }
</style>

</head>
<body>

<div class="register-container">
    <div class="register-title">REGISTRAR</div>

    <form onsubmit="handleRegister(event)">
        <input type="text" id="nome" placeholder="Nome completo" required />
        <input type="text" id="ra" placeholder="RA (Registro Acadêmico)" required />
        <input type="email" id="email" placeholder="E-mail" required />
        <input type="password" id="senha" placeholder="Senha de acesso" required />
        <button type="submit" class="register-btn">REGISTRAR</button>
    </form>
    
    <a href="Login.html" class="login-link">Já tenho conta →</a>
</div>

<script>
    const API_URL = 'http://localhost:4000';

    async function handleRegister(event) {
        event.preventDefault(); 

        const nome = document.getElementById('nome').value;
        const ra = document.getElementById('ra').value;
        const email = document.getElementById('email').value;
        const senha = document.getElementById('senha').value;

        try {
            const response = await fetch(`${API_URL}/auth/register`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ nome, ra, email, senha })
            });

            const data = await response.json();

            if (response.ok) {
                alert('Cadastro realizado com sucesso! Faça login.');
                window.location.href = 'Login.html';
            } else {
                alert(`Erro ao registrar: ${data.message || 'Verifique os dados e tente novamente.'}`);
            }
        } catch (error) {
            console.error('Erro na requisição:', error);
            alert('Erro de conexão com o servidor. Verifique se o backend está ativo na porta 4000.');
        }
    }
</script>

</body>
</html>
