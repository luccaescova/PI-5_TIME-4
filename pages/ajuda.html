<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leiturar – Suporte IA</title>

<style>
    /* Reset e Configuração da Tela Cheia */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body { 
        background-color: #1C3B3B; /* Seu verde escuro base */
        width: 100vw;
        height: 100vh;
        display: flex; 
        justify-content: center; 
        align-items: center;
        overflow: hidden;
        padding: 20px;
    }

    /* Container Principal Estilo Neobrutalista Moderno */
    .container { 
        background-color: #C9FF8F; /* O verde limão original em harmonia */
        width: 100%;
        max-width: 900px; 
        height: 90vh;
        border: 4px solid #000000;
        border-radius: 16px; 
        overflow: hidden; 
        position: relative; 
        box-shadow: 10px 10px 0px #000000; /* Sombra sólida marcante */
        display: flex;
        flex-direction: column;
    }

    /* Header Limpo e Alinhado */
    header { 
        display: flex; 
        align-items: center; 
        justify-content: space-between; 
        padding: 20px 30px; 
        background-color: #C9FF8F; 
        border-bottom: 4px solid #000000;
    }

    .left-area { display: flex; align-items: center; gap: 20px; }
    
    /* Ícone Hamburger mais moderno */
    .menu-icon { 
        width: 30px; 
        height: 4px; 
        background-color: black; 
        position: relative; 
        cursor: pointer; 
    }
    .menu-icon::before, .menu-icon::after { 
        content: ""; 
        width: 30px; 
        height: 4px; 
        background-color: black; 
        position: absolute; 
        left: 0; 
        transition: 0.2s;
    }
    .menu-icon::before { top: -8px; } 
    .menu-icon::after { top: 8px; }

    .logo { 
        font-size: 24px; 
        font-weight: 900; 
        color: black; 
        text-transform: uppercase;
        letter-spacing: -1px;
    }

    /* Dropdown Estilizado */
    .dropdown-menu { 
        position: absolute; 
        top: 75px; 
        left: 30px; 
        background-color: #ffffff; 
        border: 3px solid black; 
        border-radius: 8px; 
        display: none; 
        flex-direction: column; 
        width: 180px; 
        z-index: 1000; 
        box-shadow: 4px 4px 0px #000000;
    }
    .dropdown-menu button { 
        padding: 12px; 
        background: none; 
        border: none; 
        border-bottom: 2px solid black; 
        cursor: pointer; 
        font-weight: bold; 
        text-align: left; 
        transition: background 0.1s;
    }
    .dropdown-menu button:last-child { border-bottom: none; }
    .dropdown-menu button:hover { background-color: #C9FF8F; }
    
    /* Área de Conteúdo Interno com Rolagem Fluida se necessário */
    .content {
        background-color: white;
        flex: 1;
        margin: 25px;
        padding: 30px;
        border-radius: 12px;
        border: 3px solid #000;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        box-shadow: 4px 4px 0px #000000;
    }

    .section-title { 
        font-size: 28px; 
        font-weight: 900; 
        color: #000; 
        margin-bottom: 8px; 
        text-transform: uppercase;
    }
    .section-text { font-size: 15px; color: #333; margin-bottom: 20px; font-weight: 500; }

    /* Textarea Responsivo */
    .textarea-input {
        width: 100%;
        min-height: 100px;
        max-height: 150px;
        padding: 15px;
        font-size: 16px;
        font-weight: 600;
        border: 3px solid #000;
        border-radius: 8px;
        resize: vertical;
        margin-bottom: 20px;
        box-sizing: border-box;
        outline: none;
        transition: 0.1s;
    }
    .textarea-input:focus {
        box-shadow: 4px 4px 0px #000000;
        transform: translate(-2px, -2px);
    }

    /* Botão de Envio Neobrutalista */
    .send-btn {
        width: 100%;
        padding: 16px;
        background-color: #7CD957; /* Verde vivo original */
        border: 3px solid #000;
        border-radius: 8px;
        font-size: 18px;
        font-weight: 800;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.1s ease;
        box-shadow: 4px 4px 0px #000000;
    }
    .send-btn:hover {
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0px #000000;
        background-color: #8ce666;
    }
    .send-btn:active {
        transform: translate(4px, 4px);
        box-shadow: 0px 0px 0px #000000;
    }
    .send-btn:disabled { 
        background-color: #ccc; 
        cursor: not-allowed; 
        transform: none !important;
        box-shadow: none !important;
    }

    /* Janela de Resposta da IA Renovada */
    #ai-response-container {
        margin-top: 25px;
        padding: 20px;
        background-color: #f3f4f6;
        border: 3px solid #000000;
        border-radius: 8px;
        display: none; 
        box-shadow: 4px 4px 0px #000000;
    }

    .ai-label { 
        font-size: 14px;
        font-weight: 800; 
        color: #000; 
        text-transform: uppercase;
        margin-bottom: 10px; 
        display: block; 
        letter-spacing: 0.5px;
    }
    .ai-text { 
        font-size: 15px; 
        line-height: 1.6; 
        color: #111; 
        font-weight: 500;
        white-space: pre-wrap; 
    }
</style>
</head>

<body>

<div class="container">
    <header>
        <div class="left-area">
            <div class="menu-icon" onclick="toggleDropdown()"></div>
            <div class="logo">Leiturar AI</div>
        </div>
        <div id="dropdownMenu" class="dropdown-menu">
            <button onclick="window.location.href='menu.html'">Menu</button>
            <button onclick="window.location.href='Favoritos.html'">Favoritos</button>
            <button onclick="window.location.href='recomendacao.html'">Recomendações</button>
            <button onclick="handleLogout()">Sair</button>
        </div>
    </header>

    <div class="content">
        <div class="section-title">Assistente Virtual</div>
        <p class="section-text">
            Pergunte qualquer coisa sobre os livros, autores ou como usar o Leiturar. Nossa IA está pronta para ajudar!
        </p>

        <textarea class="textarea-input" id="user-prompt" placeholder="Ex: Quem escreveu Dom Casmurro? ou Como favorito um livro?"></textarea>

        <button class="send-btn" id="btn-ask">Perguntar ao Gemini</button>

        <div id="ai-response-container">
            <span class="ai-label">Resposta do Leiturar:</span>
            <div class="ai-text" id="ai-answer"></div>
        </div>
    </div>
</div>

<script>
/* LÓGICA DE INTERFACE MANTIDA */
function handleLogout() {
    localStorage.removeItem('leiturar_token');
    localStorage.removeItem('leiturar_user');
    window.location.href = 'Login.html';
}

function toggleDropdown() {
    const menu = document.getElementById("dropdownMenu");
    menu.style.display = (menu.style.display === "flex") ? "none" : "flex";
}

/* ===== INTEGRAÇÃO COM O BACKEND (GEMINI STREAMING) ===== */
document.getElementById("btn-ask").addEventListener("click", async () => {
    const promptInput = document.getElementById("user-prompt");
    const prompt = promptInput.value.trim();
    const btn = document.getElementById("btn-ask");
    const responseContainer = document.getElementById("ai-response-container");
    const answerDiv = document.getElementById("ai-answer");

    if (!prompt) {
        alert("Por favor, digite uma pergunta.");
        return;
    }

    // Estado de carregamento inicial
    btn.innerText = "IA processando...";
    btn.disabled = true;
    answerDiv.innerText = ""; // Limpa a resposta anterior
    responseContainer.style.display = "block"; // Já mostra o container para o texto surgir

    try {
        const response = await fetch("http://localhost:4000/help/ask", {
            method: "POST",
            headers: { 
                "Content-Type": "application/json",
                "Authorization": `Bearer ${localStorage.getItem('leiturar_token')}` 
            },
            body: JSON.stringify({ prompt })
        });

        if (!response.ok) {
            const errorData = await response.json();
            throw new Error(errorData.error || "Erro no servidor");
        }

        // --- LÓGICA DE STREAMING ---
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        
        while (true) {
            const { done, value } = await reader.read();
            if (done) break; // Acabou a resposta

            // Decodifica o pedaço binário em texto e adiciona na div
            const chunkText = decoder.decode(value, { stream: true });
            answerDiv.innerText += chunkText;
            
            // Scroll automático para acompanhar o texto surgindo (opcional)
            responseContainer.scrollTop = responseContainer.scrollHeight;
        }

        promptInput.value = ""; // Limpa o campo após o sucesso total

    } catch (err) {
        console.error(err);
        alert("Erro: " + err.message);
    } finally {
        btn.innerText = "Perguntar ao Gemini";
        btn.disabled = false;
    }
});
</script>

</body>
</html>
