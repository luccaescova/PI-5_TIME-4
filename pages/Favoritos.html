<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leiturar – Favoritos</title>

<style>
    /* Reset e Configuração da Tela Cheia */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
        background-color: #1C3B3B; /* Verde escuro base */
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        padding: 20px;
    }

    /* Container Principal */
    .container {
        background-color: #C9FF8F; /* Verde limão clássico */
        width: 100%;
        max-width: 1000px;
        height: 90vh;
        border: 4px solid #000000;
        border-radius: 16px;
        overflow: hidden;
        position: relative;
        box-shadow: 10px 10px 0px #000000;
        display: flex;
        flex-direction: column;
    }

    /* ------ TOPO ------ */
    header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 35px;
        background-color: #C9FF8F;
        border-bottom: 4px solid #000000;
        position: relative;
    }

    .left-area {
        display: flex;
        align-items: center;
        gap: 25px;
    }

    /* Ícone Menu Hambúrguer */
    .menu-icon {
        width: 30px;
        height: 4px;
        background-color: black;
        position: relative;
        cursor: pointer;
    }

    .menu-icon::before,
    .menu-icon::after {
        content: "";
        width: 30px;
        height: 4px;
        background-color: black;
        position: absolute;
        left: 0;
        transition: 0.2s;
    }

    .menu-icon::before { top: -8px; }
    .menu-icon::after { top: 8px; }

    .logo {
        font-size: 24px;
        font-weight: 900;
        color: black;
        text-transform: uppercase;
        letter-spacing: -1px;
    }

    /* ------ PESQUISA ------ */
    .search-area {
        display: flex;
        align-items: center;
    }

    .search-input {
        padding: 10px 16px;
        border-radius: 8px;
        border: 3px solid #000000;
        width: 260px;
        font-size: 14px;
        font-weight: 600;
        outline: none;
        transition: 0.1s;
    }

    .search-input:focus {
        box-shadow: 3px 3px 0px #000000;
        transform: translate(-1px, -1px);
    }

    /* ------ ÁREA INTERNA (BOX BRANCO) ------ */
    .content {
        background-color: white;
        margin: 25px;
        padding: 30px;
        border-radius: 12px;
        border: 3px solid #000;
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        box-shadow: 4px 4px 0px #000000;
    }

    .section-title {
        font-size: 28px;
        font-weight: 900;
        margin-bottom: 25px;
        color: #000;
        text-transform: uppercase;
    }

    /* Grid/Linha de Livros com Rolagem Confortável */
    .books-row {
        display: flex;
        justify-content: flex-start;
        gap: 25px;
        flex-wrap: wrap;
    }

    /* Card de Livro Neobrutalista */
    .book {
        width: 180px;
        background-color: #ffffff;
        border: 3px solid #000000;
        border-radius: 12px;
        padding: 12px;
        text-align: center;
        cursor: pointer;
        transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        box-shadow: 4px 4px 0px #000000;
    }

    .book:hover {
        transform: translate(-4px, -4px);
        box-shadow: 8px 8px 0px #000000;
        background-color: #C9FF8F; /* Acende no tom da marca */
    }

    .book img {
        width: 100%;
        height: 220px;
        object-fit: cover;
        border-radius: 8px;
        border: 3px solid #000000;
    }

    .book-title {
        margin-top: 12px;
        font-weight: 800;
        font-size: 14px;
        color: #000;
        line-height: 1.3;
    }

    #emptyMsg {
        font-size: 16px;
        font-weight: 600;
        color: #666;
        margin-top: 10px;
    }

    /* ------ POPUP MODERNIZADO ------ */
    .popup-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(28, 59, 59, 0.7); /* Fundo escuro levemente esverdeado opaco */
        backdrop-filter: blur(4px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 2000;
    }

    .popup {
        background: #ffffff;
        padding: 30px;
        width: 360px;
        border-radius: 16px;
        border: 4px solid black;
        text-align: center;
        box-shadow: 8px 8px 0px #000000;
    }

    .popup h2 {
        margin: 0 0 20px 0;
        font-size: 24px;
        font-weight: 900;
        text-transform: uppercase;
        color: #000;
    }

    .popup button {
        width: 100%;
        padding: 12px;
        font-size: 16px;
        margin-top: 12px;
        border-radius: 8px;
        border: 3px solid black;
        cursor: pointer;
        font-weight: 800;
        text-transform: uppercase;
        transition: all 0.1s ease;
        box-shadow: 3px 3px 0px #000000;
    }

    .popup button:hover {
        transform: translate(-2px, -2px);
        box-shadow: 5px 5px 0px #000000;
    }

    .popup button:active {
        transform: translate(2px, 2px);
        box-shadow: 0px 0px 0px #000000;
    }

    .btn-ler { background-color: #7CD957; color: #000; }
    .btn-ler:hover { background-color: #8ce666; }

    .btn-questoes { background-color: #FFF275; color: #000; }
    .btn-questoes:hover { background-color: #fff594; }

    #btnDesfavoritar { background-color: #ffaf52; color: #000; }
    #btnDesfavoritar:hover { background-color: #ffbe73; }

    .btn-close { background-color: #ff6961; color: #fff; }
    .btn-close:hover { background-color: #ff827c; }

    /* ------ DROPDOWN MENU ------ */
    .dropdown-menu {
        position: absolute;
        top: 75px;
        left: 35px;
        background-color: #ffffff;
        border: 3px solid black;
        border-radius: 8px;
        display: none;
        flex-direction: column;
        width: 180px;
        z-index: 1000;
        box-shadow: 4px 4px 0px #000000;
    }

    .dropdown-menu button {
        padding: 12px;
        background: none;
        border: none;
        border-bottom: 2px solid black;
        cursor: pointer;
        font-weight: bold;
        text-align: left;
        transition: background 0.1s;
    }

    .dropdown-menu button:hover {
        background-color: #C9FF8F;
    }

    .dropdown-menu button:last-child {
        border-bottom: none;
    }
</style>
</head>

<body>

<div class="container">

    <header>
        <div class="left-area">
            <div class="menu-icon" onclick="toggleDropdown()"></div>
            <div class="logo">Leiturar</div>
        </div>

        <div class="search-area">
            <input class="search-input" type="search" placeholder="Pesquisar...">
        </div>

        <div id="dropdownMenu" class="dropdown-menu">
            <button onclick="window.location.href='Menu.html'">Menu</button>
            <button onclick="window.location.href='ajuda.html'">Dúvidas</button>
            <button onclick="handleLogout()">Logout</button>
        </div>
    </header>

    <div class="content">
        <div class="section-title">Seus favoritos</div>
        <div class="books-row" id="booksList"></div>
        <p id="emptyMsg">Sem livros favoritados</p>
    </div>

</div>

<!-- POPUP -->
<div class="popup-bg" id="popupBg">
    <div class="popup">
        <h2 id="popupTitle">Livro</h2>
        <button class="btn-ler" id="btnLer">Ler</button>
        <button class="btn-questoes" id="btnQuestoes">Questões</button>
        <button id="btnDesfavoritar">Desfavoritar</button>
        <button class="btn-close" onclick="closePopup()">Fechar</button>
    </div>
</div>

<script>

    const API_URL = "http://localhost:4000";

    const favorites = JSON.parse(localStorage.getItem("favoritos")) || [];
    const booksList = document.getElementById("booksList");
    const emptyMsg = document.getElementById("emptyMsg");

    let allBooks = [];

    function handleLogout() {
        localStorage.removeItem('leiturar_token');
        localStorage.removeItem('leiturar_user');
        window.location.href = 'Login.html';
    }

    async function loadBooks() {
        const token = localStorage.getItem("leiturar_token");
        if (!token) {
            window.location.href = "Login.html";
            return;
        }

        try {
            const res = await fetch(`${API_URL}/books`, {
                headers: { "Authorization": `Bearer ${token}` }
            });

            allBooks = await res.json();

            if (!res.ok) {
                booksList.innerHTML = "<p>Erro ao carregar livros.</p>";
                return;
            }

            renderFavorites();

        } catch (err) {
            console.error(err);
            booksList.innerHTML = "<p>Erro de conexão com o servidor.</p>";
        }
    }

    function renderFavorites() {
        if (favorites.length === 0) {
            emptyMsg.style.display = "block";
            return;
        }

        emptyMsg.style.display = "none";
        booksList.innerHTML = "";

        favorites.forEach(id => {
            const book = allBooks.find(b => b._id === id);
            if (!book) return;

            const imageUrl = book.coverUrl || `img/${book._id}.jpg`;

            booksList.innerHTML += `
                <div class="book" onclick="openFavPopup('${book._id}')">
                    <img src="${imageUrl}"
                        onerror="this.src='https://placehold.co/230x300/cccccc/000?text=Capa+Indisponível'">
                    <div class="book-title">${book.titulo} ${favorites.includes(book._id) ? "⭐" : ""}</div>
                </div>
            `;
        });
    }

    let currentBook = null;

    function openFavPopup(bookId) {
        const book = allBooks.find(b => b._id === bookId);
        if (!book) return;

        currentBook = bookId;

        document.getElementById("popupTitle").innerText = book.titulo;
        document.getElementById("popupBg").style.display = "flex";

        document.getElementById("btnLer").onclick = () => {
            if (book.htmlUrl) {
                window.location.href = `reader.html?id=${encodeURIComponent(bookId)}`;
            } else {
                window.location.href = `pdfs/${bookId}.pdf`;
            }
        };

        document.getElementById("btnQuestoes").onclick = () => {
            window.location.href = `Question.html?livro=${bookId}`;
        };

        document.getElementById("btnDesfavoritar").onclick = () => {
            removeFavorite(bookId);
        };
    }

    function closePopup() {
        document.getElementById("popupBg").style.display = "none";
    }

    function removeFavorite(id) {
        const updated = favorites.filter(f => f !== id);
        localStorage.setItem("favoritos", JSON.stringify(updated));
        location.reload();
    }

    /* ===== PESQUISA ===== */
    const searchInput = document.querySelector(".search-input");
    searchInput.addEventListener("input", () => {
        const q = searchInput.value.toLowerCase();
        const filtered = allBooks.filter(book =>
            favorites.includes(book._id) &&
            book.titulo.toLowerCase().includes(q)
        );

        booksList.innerHTML = "";

        filtered.forEach(book => {
            const imageUrl = book.coverUrl || `img/${book._id}.jpg`;
            booksList.innerHTML += `
                <div class="book" onclick="openFavPopup('${book._id}')">
                    <img src="${imageUrl}"
                        onerror="this.src='https://placehold.co/230x300/cccccc/000?text=Capa+Indisponível'">
                    <div class="book-title">${book.titulo} ${favorites.includes(book._id) ? "⭐" : ""}</div>
                </div>
            `;
        });

    });

    /* ===== DROPDOWN ===== */
    function toggleDropdown() {
        const menu = document.getElementById("dropdownMenu");
        menu.style.display = menu.style.display === "flex" ? "none" : "flex";
    }

    window.addEventListener("click", function(e) {
        const menu = document.getElementById("dropdownMenu");
        const icon = document.querySelector(".menu-icon");
        if (!menu.contains(e.target) && !icon.contains(e.target)) {
            menu.style.display = "none";
        }
    });

    window.onload = loadBooks;

</script>

</body>
</html>
