<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leiturar – Menu</title>

<style>
    /* Reset e Variáveis Base */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
        background-color: #1C3B3B; /* Mantendo o verde escuro padrão */
        display: flex;
        justify-content: center;
        padding: 0;
        min-height: 100vh;
    }

    /* Container Principal */
    .container {
        background-color: #C9FF8F; /* Verde limão neobrutalista */
        width: 100%;
        max-width: 1200px;
        min-height: 100vh;
        border-left: 6px solid #000000;
        border-right: 6px solid #000000;
        position: relative;
        display: flex;
        flex-direction: column;
    }

    /* ------ TOPO / HEADER ------ */
    header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 25px 35px;
        background-color: #C9FF8F;
        border-bottom: 6px solid #000000;
        position: relative;
    }

    .left-area {
        display: flex;
        align-items: center;
        gap: 25px;
    }

    /* Ícone de Menu Neobrutalista */
    .menu-icon {
        width: 35px;
        height: 6px;
        background-color: #000000;
        position: relative;
        cursor: pointer;
        transition: transform 0.1s ease;
    }

    .menu-icon::before,
    .menu-icon::after {
        content: "";
        width: 35px;
        height: 6px;
        background-color: #000000;
        position: absolute;
        left: 0;
    }

    .menu-icon::before { top: -10px; }
    .menu-icon::after { top: 10px; }

    .menu-icon:hover {
        transform: scale(1.1);
    }

    .logo {
        font-size: 32px;
        font-weight: 900;
        color: #000000;
        text-transform: uppercase;
        letter-spacing: -1px;
    }

    /* ------ BARRA DE PESQUISA ------ */
    .search-area {
        display: flex;
        align-items: center;
    }

    .search-input {
        padding: 10px 16px;
        border-radius: 8px;
        border: 3px solid #000000;
        width: 280px;
        font-size: 15px;
        font-weight: 600;
        background-color: #ffffff;
        outline: none;
        transition: all 0.1s ease;
    }

    .search-input:focus {
        box-shadow: 4px 4px 0px #000000;
        transform: translate(-2px, -2px);
    }

    /* ------ ÁREA DE CONTEÚDO ------ */
    .content {
        background-color: #ffffff;
        margin: 40px auto;
        width: 92%;
        padding: 30px;
        border-radius: 16px;
        border: 4px solid #000000;
        box-shadow: 8px 8px 0px #000000;
        flex-grow: 1;
        margin-bottom: 40px;
    }

    .section-title {
        font-size: 28px;
        font-weight: 900;
        margin-bottom: 25px;
        color: #000000;
        text-transform: uppercase;
        letter-spacing: -0.5px;
    }

    /* Grid de Livros */
    .books-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 25px;
        align-items: flex-start;
    }

    /* Card do Livro Individual */
    .book {
        background-color: #C9FF8F;
        border: 3px solid #000000;
        border-radius: 12px;
        padding: 14px;
        text-align: center;
        cursor: pointer;
        transition: all 0.1s ease;
        box-shadow: 4px 4px 0px #000000;
        display: flex;
        flex-direction: column;
        height: 100%;
    }

    .book:hover {
        transform: translate(-4px, -4px);
        box-shadow: 8px 8px 0px #000000;
    }

    .book:active {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0px #000000;
    }

    .book img {
        width: 100%;
        height: 230px;
        object-fit: cover;
        border-radius: 8px;
        border: 3px solid #000000;
        background: #f0f0f0;
    }

    .book-title {
        margin-top: 12px;
        font-weight: 800;
        font-size: 16px;
        color: #000000;
        line-height: 1.2;
        flex-grow: 1;
    }

    .book-author {
        font-size: 13px;
        font-weight: 600;
        color: #333333;
        margin-top: 6px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    /* ------ POPUP MODAL ------ */
    .popup-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(28, 59, 59, 0.75);
        backdrop-filter: blur(4px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 2000;
    }

    .popup {
        background: #C9FF8F;
        padding: 30px;
        width: 100%;
        max-width: 360px;
        border-radius: 16px;
        border: 4px solid #000000;
        box-shadow: 10px 10px 0px #000000;
        text-align: center;
    }

    .popup h2 {
        margin: 0 0 20px 0;
        font-size: 24px;
        font-weight: 900;
        color: #000000;
        text-transform: uppercase;
    }

    /* Botões do Popup */
    .popup button {
        width: 100%;
        padding: 12px;
        font-size: 16px;
        margin-top: 12px;
        border-radius: 8px;
        border: 3px solid #000000;
        cursor: pointer;
        font-weight: 800;
        text-transform: uppercase;
        box-shadow: 3px 3px 0px #000000;
        transition: all 0.1s ease;
    }

    .popup button:hover {
        transform: translate(-2px, -2px);
        box-shadow: 5px 5px 0px #000000;
    }

    .popup button:active {
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0px #000000;
    }

    .btn-ler { background-color: #7CD957; color: #000; }
    .btn-ler:hover { background-color: #8ce666; }

    .btn-fav { background-color: #8ec5ff; color: #000; }
    .btn-fav:hover { background-color: #a3d2ff; }

    .btn-questoes { background-color: #FFF275; color: #000; }
    .btn-questoes:hover { background-color: #fff491; }

    .btn-close { background-color: #ff6961; color: #ffffff; }
    .btn-close:hover { background-color: #ff827c; }

    /* ------ DROPDOWN MENU ------ */
    .dropdown-menu {
        position: absolute;
        top: 80px;
        left: 35px;
        background-color: #ffffff;
        border: 4px solid #000000;
        border-radius: 12px;
        display: none;
        flex-direction: column;
        width: 200px;
        z-index: 1500;
        box-shadow: 6px 6px 0px #000000;
        overflow: hidden;
    }

    .dropdown-menu button {
        padding: 14px 16px;
        background: #ffffff;
        border: none;
        border-bottom: 3px solid #000000;
        cursor: pointer;
        font-weight: 800;
        text-align: left;
        font-size: 15px;
        color: #000000;
        transition: background-color 0.1s ease;
    }

    .dropdown-menu button:hover {
        background-color: #C9FF8F;
    }

    .dropdown-menu button:last-child {
        border-bottom: none;
        background-color: #ff6961;
        color: white;
    }
    
    .dropdown-menu button:last-child:hover {
        background-color: #ff5252;
    }
</style>
</head>

<body>

<div class="container">

    <!-- TOPO -->
    <header>
        <div class="left-area">
            <div class="menu-icon" onclick="toggleDropdown()"></div>
            <div class="logo">Leiturar</div>
        </div>

        <div class="search-area">
            <input class="search-input" type="search" placeholder="Pesquisar livros...">
        </div>

        <!-- DROPDOWN -->
        <div id="dropdownMenu" class="dropdown-menu">
            <button onclick="window.location.href='Favoritos.html'">⭐ Favoritos</button>
            <button onclick="window.location.href='ajuda.html'">❓ Dúvidas</button>
            <button onclick="handleLogout()">🚪 Sair (Logout)</button>
        </div>
    </header>

    <!-- CONTEÚDO -->
    <div class="content">
        <div class="section-title">Livros Disponíveis</div>
        <div class="books-grid" id="books-grid">
            <p style="font-weight: 600;">Carregando acervo...</p>
        </div>
    </div>

</div>

<!-- POPUP -->
<div class="popup-bg" id="popupBg">
    <div class="popup">
        <h2 id="popupTitle">Título do Livro</h2>
        <button id="btnLer" class="btn-ler">Ler livro</button>
        <button id="btnFavoritar" class="btn-fav">Adicionar aos favoritos</button>
        <button id="btnQuestoes" class="btn-questoes">Resolver questões</button>
        <button onclick="closePopup()" class="btn-close">Fechar</button>
    </div>
</div>

<script>
    const API_URL = 'http://localhost:4000';
    const booksGrid = document.getElementById('books-grid');
    let allBooks = [];

    function handleLogout() {
        localStorage.removeItem('leiturar_token');
        localStorage.removeItem('leiturar_user');
        window.location.href = 'Login.html';
    }

    /* ===== CARREGAR LIVROS ===== */
    async function loadBooks() {
        const token = localStorage.getItem('leiturar_token');
        
        if (!token) {
            window.location.href = 'Login.html';
            return;
        }

        try {
            const res = await fetch(`${API_URL}/books`, {
                headers: { "Authorization": `Bearer ${token}` }
            });

            const books = await res.json();

            if (res.ok) {
                allBooks = books;
                renderBooks(allBooks);
            } else {
                booksGrid.innerHTML = "<p style='font-weight:600;'>Erro ao carregar livros.</p>";
            }

        } catch (err) {
            console.error(err);
            booksGrid.innerHTML = "<p style='font-weight:600;'>Erro de conexão com o servidor.</p>";
        }
    }

    function escapeHtml(s) {
        return String(s || '').replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        })[c]);
    }

    /* ===== RENDERIZAR LIVROS ===== */
    function renderBooks(books) {
        booksGrid.innerHTML = "";

        if (books.length === 0) {
            booksGrid.innerHTML = "<p style='font-weight:600;'>Nenhum livro encontrado para a busca.</p>";
            return;
        }

        const favs = JSON.parse(localStorage.getItem("favoritos") || "[]");

        books.forEach(book => {
            const imageUrl = book.coverUrl || `img/${book._id}.jpg`;
            const isFav = favs.includes(book._id);

            booksGrid.innerHTML += `
                <div class="book" onclick="openBookPopup('${book._id}')">
                    <img src="${imageUrl}" alt="Capa"
                        onerror="this.src='https://placehold.co/180x230/cccccc/000000?text=Sem+Imagem'">
                    <div class="book-title">${escapeHtml(book.titulo)} ${isFav ? "⭐" : ""}</div>
                    <div class="book-author">${escapeHtml(book.autor || '')}</div>
                </div>
            `;
        });
    }

    /* ===== POPUP DO LIVRO ===== */
    function openBookPopup(id) {
        const book = allBooks.find(b => b._id === id);
        if (!book) return;

        document.getElementById("popupTitle").innerText = book.titulo;
        document.getElementById("popupBg").style.display = "flex";

        document.getElementById("btnLer").onclick = () => {
            if (book.htmlUrl) {
                window.location.href = `reader.html?id=${encodeURIComponent(id)}`;
            } else {
                window.location.href = `pdfs/${id}.pdf`;
            }
        };

        document.getElementById("btnQuestoes").onclick = () => {
            window.location.href = `Question.html?livro=${id}`;
        };

        const favBtn = document.getElementById("btnFavoritar");
        let favs = JSON.parse(localStorage.getItem("favoritos") || "[]");

        if (favs.includes(id)) {
            favBtn.innerText = "Remover dos favoritos";
            favBtn.onclick = () => removeFavorite(id);
        } else {
            favBtn.innerText = "Adicionar aos favoritos";
            favBtn.onclick = () => addFavorite(id);
        }
    }

    function closePopup() {
        document.getElementById("popupBg").style.display = "none";
    }

    /* ===== FAVORITOS ===== */
    function addFavorite(id) {
        let favs = JSON.parse(localStorage.getItem("favoritos") || "[]");
        if (!favs.includes(id)) {
            favs.push(id);
            localStorage.setItem("favoritos", JSON.stringify(favs));
        }
        closePopup();
        renderBooks(allBooks);
    }

    function removeFavorite(id) {
        let favs = JSON.parse(localStorage.getItem("favoritos") || "[]");
        favs = favs.filter(f => f !== id);
        localStorage.setItem("favoritos", JSON.stringify(favs));
        closePopup();
        renderBooks(allBooks);
    }

    /* ===== PESQUISA ===== */
    const searchInput = document.querySelector(".search-input");

    searchInput.addEventListener("input", function () {
        const q = this.value.toLowerCase();
        const filtered = allBooks.filter(book =>
            book.titulo.toLowerCase().includes(q)
        );
        renderBooks(filtered);
    });

    /* ===== DROPDOWN ===== */
    function toggleDropdown() {
        const menu = document.getElementById("dropdownMenu");
        menu.style.display = menu.style.display === "flex" ? "none" : "flex";
    }

    window.addEventListener("click", function(e) {
        const menu = document.getElementById("dropdownMenu");
        const icon = document.querySelector(".menu-icon");
        if (!menu.contains(e.target) && !icon.contains(e.target)) {
            menu.style.display = "none";
        }
    });

    /* ===== INICIAR ===== */
    window.onload = loadBooks;
</script>

</body>
</html>
